packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# 공통 의존성 버전을 한 곳에서 관리.
# 각 패키지에서는 "typescript": "catalog:" 처럼 참조한다.
catalog:
  # TypeScript 7(네이티브 컴파일러)은 typescript-eslint 8.x 가 아직 미지원(>=4.8.4 <6.1.0).
  # next build / tsc 는 통과하지만 eslint 가 완전히 실패하므로 5.x 유지.
  # 생태계가 따라오면 이 줄만 ^7 로 올리면 된다.
  typescript: ^5.9.3
  "@types/node": ^22.18.1
  # zod 4 는 z.toJSONSchema() 가 내장이라 LLM 구조화 출력 스키마를 같은 정의에서 뽑는다
  zod: ^4.5.4

# 설치 시 빌드 스크립트 실행을 허용할 패키지.
# pnpm 은 기본적으로 차단하므로 명시적으로 허용해야 한다.
allowBuilds:
  esbuild: true # vercel CLI 의존성. 네이티브 바이너리를 받는 정상 빌드다.
  sharp: false
  unrs-resolver: false
